name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run lint:content
      # Parser, search, decoding, hunts and findings against real EVTX
      # fixtures (tests/fixtures/evtx).
      - run: npm test
