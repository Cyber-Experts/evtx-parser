id: 8002
channel: applocker
channelName: Microsoft-Windows-AppLocker/EXE and DLL
provider: Microsoft-Windows-AppLocker
title: File was allowed to run
shortTitle: EXE or DLL allowed
category: application-control
summary: >-
  AppLocker event 8002 records that an executable or DLL was allowed to run by an AppLocker
  rule, with the file path, matching rule and user SID.
description: |-
  Event 8002 is written to the AppLocker **EXE and DLL** log when an executable (or, if DLL rules are enabled, a DLL) is evaluated against the policy and allowed by a rule. The data sits under `UserData/RuleAndFileData`: the rule collection (`PolicyName`), the rule that matched (`RuleId`, `RuleName`), the user (`TargetUser`, `TargetLogonId`), the file (`FilePath`, `FullFilePath`, `FileHash`, `Fqbn`) and the process ID.

  Because every allowed launch is logged, 8002 works as a lightweight execution history on hosts with AppLocker, including the signer (`Fqbn`) and hash of each binary — useful where Sysmon or process creation auditing is missing.

  The flip side is volume, especially with DLL rules. The value lies in rare paths and in broad allow rules: a file from a user-writable folder allowed by a path rule such as "all files in the Windows folder" can indicate a bypass through a writable subdirectory.
logging:
  enabledByDefault: false
  requirement: >-
    An AppLocker policy with Executable (and optionally DLL) rules — Computer Configuration > Windows
    Settings > Security Settings > Application Control Policies > AppLocker — and the Application
    Identity service (AppIDSvc) running. Logged for allowed files in both Audit only and Enforce rules modes.
  notes: >-
    DLL rules are off unless enabled in the policy's advanced settings, and they add significant
    volume. Microsoft notes the EXE and DLL log is very verbose; many collectors keep only warnings
    and errors from it. AppLocker enforcement depends on the Windows edition; unsupported editions
    log 8008 instead.
fields:
  - name: PolicyName
    description: Rule collection that evaluated the file.
    values:
      - value: EXE
        meaning: Executable rules (.exe and .com).
      - value: DLL
        meaning: DLL rules (.dll and .ocx) — only evaluated when DLL rule enforcement is turned on.
  - name: RuleId
    description: >-
      GUID of the AppLocker rule that matched. An all-zero GUID means no rule matched and the
      file fell under the implicit deny.
  - name: RuleName
    description: Name of the matching rule (for example `(Default Rule) All files located in the Windows folder`), or `-` when none matched.
  - name: RuleSddl
    description: Security descriptor of the rule, showing which user or group SID the rule applies to.
  - name: TargetUser
    description: SID of the user who tried to run the file.
  - name: TargetProcessId
    description: ID of the process involved in the execution attempt; correlate with Security 4688 or Sysmon 1.
  - name: TargetLogonId
    description: Logon session of the user; pivot to Security 4624 and 4688 with the same logon ID.
  - name: FilePath
    description: >-
      Path of the file written with AppLocker path variables, e.g. `%OSDRIVE%\USERS\...`,
      `%SYSTEM32%\...`, `%PROGRAMFILES%\...`.
  - name: FullFilePath
    description: The same path in plain form (`C:\Users\...`). Present on current Windows versions.
  - name: FileHash
    description: AppLocker hash of the file, used by file hash rules.
  - name: Fqbn
    description: >-
      Fully qualified binary name from the file's signature — publisher, product, file name and
      version. `-` for unsigned files.
benign:
  - Normal program launches allowed by publisher, path or hash rules — the bulk of this log.
  - Software updates running from `Program Files` or `Windows` under the default rules.
attacker:
  - Payloads executed from writable folders under `C:\Windows` (for example `Tasks` or `Temp`) that are allowed by default path rules.
  - Signed living-off-the-land binaries (`mshta.exe`, `rundll32.exe`, `regsvr32.exe`, `msbuild.exe`) allowed by broad rules and used to proxy execution.
investigation:
  - Stack FullFilePath and Fqbn; review rare paths, unsigned files and files allowed by broad path rules.
  - Pivot on TargetLogonId and TargetProcessId to Security 4624/4688 or Sysmon 1 for the session and command line.
  - Compare with 8003/8004 in the same log to see what the policy did not allow.
related:
  - applocker/8003
  - applocker/8004
  - applocker/8005
  - security/4688
  - sysmon/1
  - sysmon/7
attack:
  - T1218
references:
  - title: Microsoft Learn — Using Event Viewer with AppLocker
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/applocker/using-event-viewer-with-applocker
  - title: Microsoft Learn — AppLocker overview
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/applocker/applocker-overview
