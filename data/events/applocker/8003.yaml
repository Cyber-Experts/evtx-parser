id: 8003
channel: applocker
channelName: Microsoft-Windows-AppLocker/EXE and DLL
provider: Microsoft-Windows-AppLocker
title: File was allowed to run but would have been prevented from running if the AppLocker policy were enforced
shortTitle: EXE or DLL would be blocked (audit)
category: application-control
summary: >-
  AppLocker event 8003 records an executable or DLL that ran but would have been blocked if the
  policy were enforced. Audit-mode view of unapproved code.
description: |-
  Event 8003 is written to the AppLocker **EXE and DLL** log when the rule collection is in **Audit only** mode and a file that no allow rule covers (or that a deny rule matches) is executed. The program still runs; the event records what enforcement would have stopped.

  Organizations often leave AppLocker in audit mode for long periods, which turns 8003 into an inventory of everything outside the approved baseline. For an investigator that is valuable: malware and attacker tools dropped in user profiles, temp folders or downloads are exactly the files that fall outside a typical policy.

  The fields are the same as 8002 and 8004: `PolicyName`, `RuleId`/`RuleName` (zero GUID and `-` when no rule matched), `TargetUser`, `TargetLogonId`, `FilePath`, `FullFilePath`, `FileHash` and `Fqbn`.
logging:
  enabledByDefault: false
  requirement: >-
    An AppLocker policy with Executable (and optionally DLL) rules — Computer Configuration > Windows
    Settings > Security Settings > Application Control Policies > AppLocker — and the Application
    Identity service (AppIDSvc) running. Logged only when the rule collection is in Audit only mode.
  notes: >-
    DLL rules are off unless enabled in the policy's advanced settings, and they add significant
    volume. Microsoft notes the EXE and DLL log is very verbose; many collectors keep only warnings
    and errors from it. AppLocker enforcement depends on the Windows edition; unsupported editions
    log 8008 instead.
fields:
  - name: PolicyName
    description: Rule collection that evaluated the file.
    values:
      - value: EXE
        meaning: Executable rules (.exe and .com).
      - value: DLL
        meaning: DLL rules (.dll and .ocx) — only evaluated when DLL rule enforcement is turned on.
  - name: RuleId
    description: >-
      GUID of the AppLocker rule that matched. An all-zero GUID means no rule matched and the
      file fell under the implicit deny.
  - name: RuleName
    description: Name of the matching rule (for example `(Default Rule) All files located in the Windows folder`), or `-` when none matched.
  - name: RuleSddl
    description: Security descriptor of the rule, showing which user or group SID the rule applies to.
  - name: TargetUser
    description: SID of the user who tried to run the file.
  - name: TargetProcessId
    description: ID of the process involved in the execution attempt; correlate with Security 4688 or Sysmon 1.
  - name: TargetLogonId
    description: Logon session of the user; pivot to Security 4624 and 4688 with the same logon ID.
  - name: FilePath
    description: >-
      Path of the file written with AppLocker path variables, e.g. `%OSDRIVE%\USERS\...`,
      `%SYSTEM32%\...`, `%PROGRAMFILES%\...`.
  - name: FullFilePath
    description: The same path in plain form (`C:\Users\...`). Present on current Windows versions.
  - name: FileHash
    description: AppLocker hash of the file, used by file hash rules.
  - name: Fqbn
    description: >-
      Fully qualified binary name from the file's signature — publisher, product, file name and
      version. `-` for unsigned files.
benign:
  - Legitimate software not yet covered by rules during an audit rollout (per-user installers, portable tools).
  - Developer and admin tools run from user profiles.
attacker:
  - Malware and tools executed from `AppData`, `Temp`, `Downloads` or `ProgramData`.
  - Renamed or unsigned binaries that would be blocked once the policy is enforced.
investigation:
  - Review files outside `Program Files` and `Windows`, unsigned files (Fqbn `-`) and first-seen hashes.
  - Pivot on TargetLogonId / TargetProcessId to the logon and process creation events for context.
  - Check the file hash against threat intelligence and look for the same file on other hosts.
related:
  - applocker/8002
  - applocker/8004
  - applocker/8006
  - security/4688
  - sysmon/1
  - code-integrity/3077
attack:
  - T1204.002
  - T1036.005
references:
