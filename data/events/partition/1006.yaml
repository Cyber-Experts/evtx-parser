id: 1006
channel: partition
provider: Microsoft-Windows-Partition
title: Partition diagnostic information for a disk
shortTitle: Disk connected (partition data)
category: device
summary: >-
  Partition event 1006 records a disk's vendor, model, serial, capacity and raw MBR/VBR bytes on connection. Rich USB evidence, incl. volume serials.
description: |-
  Event 1006 in `Microsoft-Windows-Partition/Diagnostic` is written when the partition manager processes a disk arrival or change. For removable media it is one of the richest artifacts Windows keeps: `Manufacturer`, `Model`, `SerialNumber`, `Capacity`, `BusType`, the parent device instance ID, and the **raw bytes** of the partition table (`Mbr` or GPT data) and of the first volume boot records (`Vbr0`, `Vbr1`...).

  The VBR bytes let you recover the **volume serial number** and file system of each partition even after the device is gone — the same serial found in LNK files, jump lists and prefetch — linking file access on the host to a specific USB drive. `ParentId` contains the USB instance ID and serial that match Kernel-PnP **400/410** and System **20001**.

  Records with no partition data (for example a `Capacity` of 0) are typically written when the device is removed, which helps bound the connection window.
logging:
  enabledByDefault: true
  requirement: Microsoft-Windows-Partition/Diagnostic log, enabled by default on Windows 10 and later.
  notes: >-
    Not present on Windows 7 / 8.1. Records are large because of the embedded sector dumps, so the
    log rolls over relatively quickly.
fields:
  - name: DiskNumber
    description: Disk number assigned by Windows (`\\.\PhysicalDriveN`).
  - name: Manufacturer
    description: Vendor string reported by the device.
  - name: Model
    description: Model string reported by the device.
  - name: SerialNumber
    description: Serial number reported by the disk; may be empty for some readers.
  - name: ParentId
    description: Instance ID of the parent device, e.g. `USB\VID_xxxx&PID_xxxx\<serial>` — the link to Kernel-PnP events.
  - name: Capacity
    description: Disk size in bytes.
  - name: BusType
    description: Storage bus type (STORAGE_BUS_TYPE).
    values:
      - value: "7"
        meaning: USB
      - value: "11"
        meaning: SATA
      - value: "12"
        meaning: SD
      - value: "14"
        meaning: Virtual
      - value: "15"
        meaning: File-backed virtual
      - value: "17"
        meaning: NVMe
  - name: PartitionStyle
    description: Partition table type.
    values:
      - value: "0"
        meaning: MBR
      - value: "1"
        meaning: GPT
      - value: "2"
        meaning: RAW (no partition table)
  - name: PartitionCount
    description: Number of partitions found.
  - name: Mbr
    description: Hex dump of the MBR sector (for MBR disks).
  - name: Vbr0
    description: >-
      Hex dump of the first volume boot record. Contains the file system type and the volume
      serial number used in LNK files and jump lists.
  - name: IsSystem
    description: Whether this disk holds the system partition. `0` for removable media.
benign:
  - Users plugging in USB drives, SD cards and external disks.
  - Virtual disks (VHD/VHDX) mounted on the host.
attacker:
  - >-
    Data exfiltration to USB storage: a new device with a large capacity connected shortly before
    files are accessed or copied.
investigation:
  - List devices by `Manufacturer`, `Model`, `SerialNumber` and `Capacity`; separate internal disks (`IsSystem`, SATA/NVMe) from removable ones.
  - Parse `Vbr0` to obtain the volume serial number and search LNK files and jump lists for it.
  - Join on `ParentId` with Kernel-PnP 400/410 and System 20001 to get the full connection history.
related:
  - kernel-pnp/400
  - kernel-pnp/410
  - system/20001
  - security/6416
  - security/4663
attack:
  - T1052.001
  - T1200
  - T1091
references:
  - title: MITRE ATT&CK — Exfiltration over USB (T1052.001)
    url: https://attack.mitre.org/techniques/T1052/001/
  - title: Microsoft Learn — Device instance IDs
    url: https://learn.microsoft.com/en-us/windows-hardware/drivers/install/device-instance-ids
