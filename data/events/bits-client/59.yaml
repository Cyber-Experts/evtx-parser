id: 59
channel: bits-client
provider: Microsoft-Windows-Bits-Client
title: BITS started the transfer job
shortTitle: Transfer started
category: network
summary: >-
  BITS event 59 records that BITS started transferring a job, with the job name and the remote
  URL — the event that tells you where BITS was downloading from.
description: |-
  Event 59 is written when BITS begins transferring a file for a job. It carries the job name (`name`), the job GUID (`Id`), a per-transfer GUID (`transferId`), the remote URL (`url`) and file details such as `fileLength`, `bytesTotal` and `bytesTransferred`.

  The `url` field is what makes this event valuable: it is the only place in the BITS log that names the remote resource. Stacking URLs across a fleet quickly separates Microsoft and vendor update servers from raw IP addresses, paste sites, file-sharing services or newly registered domains.

  A job can log 59 several times if the transfer is interrupted and resumed; the matching stop event is 60.
logging:
  enabledByDefault: true
  requirement: >-
    None — the Microsoft-Windows-Bits-Client/Operational channel is enabled by default.
fields:
  - name: transferId
    description: GUID of this file transfer.
  - name: name
    description: Name (title) of the job; same value as `jobTitle` in event 3.
  - name: Id
    description: GUID of the job; matches `jobId` in events 3 and 4.
  - name: url
    description: >-
      Remote URL of the file being transferred. IP-based URLs, unusual ports and non-vendor hosts
      deserve review.
  - name: peer
    description: Peer used for the transfer, when peer caching is involved; usually empty.
  - name: fileLength
    description: Size of the remote file, when known.
  - name: bytesTotal
    description: Total bytes to transfer.
  - name: bytesTransferred
    description: Bytes already transferred when the event was written (non-zero on resumed transfers).
benign:
  - Windows components and Microsoft products downloading from Microsoft update and CDN hosts.
  - Application updaters fetching from their vendors' servers.
attacker:
  - Downloads of tools or payloads from attacker infrastructure, cloud storage or paste sites via `bitsadmin` or PowerShell.
  - Repeated transfers from the same unusual host, indicating a persistent BITS job.
investigation:
  - Stack url values across hosts and review hosts that are rare or not tied to known software.
  - Pivot on Id to event 3 for the creating process and owner, and to 60 for the result.
  - Check DNS (Sysmon 22, DNS client logs) and proxy logs for the same host at the same time.
related:
  - bits-client/3
  - bits-client/60
  - bits-client/4
  - sysmon/22
  - sysmon/3
  - dns-client/3008
attack:
  - T1197
  - T1105
references:
  - title: Microsoft Learn — Background Intelligent Transfer Service
    url: https://learn.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
  - title: MITRE ATT&CK — BITS Jobs (T1197)
    url: https://attack.mitre.org/techniques/T1197/
